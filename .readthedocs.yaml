version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  # 核心：使用命令自定义构建流程
  commands:
    # 1. 创建一个空的 build/html 目录（RTD 默认寻找这个路径）
    - mkdir -p build/html
    # 2. 将你的静态 HTML 文件复制到该目录下
    - cp -r navigation_html/* build/html/
